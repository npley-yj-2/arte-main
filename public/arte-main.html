<title>arte 라이브러리 · 스크롤 모션 미리보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.css">
<style>
/* ------------------------------------------------------------------
   A scroll-driven port of the `arte-main` Remotion composition,
   animated with GSAP + ScrollTrigger.

   Every animated element is a window onto the single 1920x5359 page
   render exported from Figma:

     .m   a mask fixed at the element's page coordinates
      i   the render itself, offset so the crop lands in the mask,
           and the thing GSAP actually moves/scales/fades

   CSS only holds each element's static geometry (position, size, the
   crop's background-position, transform-origin). GSAP sets every
   animated property - transform and opacity - directly, so there are
   no `transition`/`.in` rules here: `<script>` at the bottom builds a
   timeline for the hero (plays on load) and a ScrollTrigger per
   below-the-fold element (fires once, the first time it's on screen).

   Page landmarks: header 0-133 (pinned), section01 133-624, 문서
   624-1502, 영상·도서 1502-2156, 지역별 정보 2156-2854, 추천 2854-4044,
   이벤트·행사·공지·소식 4044-4749, partner banner 4749-4881, footer
   4881-5359.
   ------------------------------------------------------------------ */
*{margin:0;padding:0;box-sizing:border-box}
html{background:#fff}
body{font:400 14px/1.5 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif;
     color:#111;overflow-x:hidden}

#root{width:1920px;margin:0 auto}
#stick{position:sticky;top:0;height:0;z-index:50;overflow:visible}
/* the "공식누리집" masthead strip's own #eef2f7 tint, extended past
   the 1920px page to the true viewport edges when the window is wider */
.mast-bleed{position:absolute;top:0;left:50%;width:100vw;height:32px;
  margin-left:-50vw;background:#eef2f7}
#page{position:relative;width:1920px;height:5359px;background:#fff}

/* ---- crop windows: a mask at the element's page position, and the
   shared page render offset inside it so the right slice shows ---- */
.m{position:absolute;overflow:hidden;
   top:calc(var(--t)*1px);left:calc(var(--l)*1px);
   width:calc(var(--w)*1px);height:calc(var(--h)*1px)}
.m>i{position:absolute;top:0;left:0;width:1920px;height:5359px;
     background-image:url(arte-main/page.png);background-size:1920px auto;
     background-repeat:no-repeat;
     background-position:calc(var(--l)*-1px) calc(var(--t)*-1px)}

/* text (rise) and plain fades (decorative chrome) start invisible so
   there's nothing to flash before GSAP sets each one's real starting
   transform; images (zoom) likewise */
.rise>i,.fade>i,.zoom>i{opacity:0}
.zoom>i{transform-origin:calc(var(--w)*.5px) calc(var(--h)*.5px)}

/* hero headline: black, then wiped left to right by the pink version
   underneath it - a plain image reveal, not a page.png crop, so it's
   clip-path rather than the .m mask technique used everywhere else */
.wipe{position:absolute;overflow:hidden;clip-path:inset(0 100% 0 0);
      top:calc(var(--t)*1px);left:calc(var(--l)*1px);
      width:calc(var(--w)*1px);height:calc(var(--h)*1px)}
.wipe img{display:block}

/* category chips / notice rows: the box itself is what GSAP moves
   (translateX / translateY), the shared render inside stays fixed on
   its own resting crop the whole time - see the JS comment below */
.slide{position:absolute;overflow:hidden;opacity:0;
       top:calc(var(--t)*1px);left:calc(var(--l)*1px);
       width:calc(var(--w)*1px);height:calc(var(--h)*1px)}
.slide>i{position:absolute;top:0;left:0;width:1920px;height:5359px;
         background-image:url(arte-main/page.png);background-size:1920px auto;
         background-repeat:no-repeat;
         background-position:calc(var(--l)*-1px) calc(var(--t)*-1px)}

.cascade{position:absolute;overflow:hidden;opacity:0;
         left:calc(var(--l)*1px);width:calc(var(--w)*1px);height:calc(var(--h)*1px);
         top:calc(var(--t)*1px)}
.cascade>i{position:absolute;top:0;left:0;width:1920px;height:5359px;
           background-image:url(arte-main/page.png);background-size:1920px auto;
           background-repeat:no-repeat;
           background-position:calc(var(--l)*-1px) calc(var(--t)*-1px)}

/* title underlines: drawn left to right (scaleX from the left edge) */
.rule{position:absolute;background:#000;transform:scaleX(0);transform-origin:left center;
      top:calc(var(--t)*1px);left:calc(var(--l)*1px);
      width:calc(var(--w)*1px);height:calc(var(--h)*1px)}

/* 추천's book-curation backdrop: opens from its own centre outward -
   transform-origin is set per element in JS from --cx */
.expand{position:absolute;background:#000;transform:scaleX(0);
        top:calc(var(--t)*1px);left:calc(var(--l)*1px);
        width:calc(var(--w)*1px);height:calc(var(--h)*1px)}

/* ---- card outlines ---------------------------------------------- */
/* Four 1px rules, each scaled from 0 with the transform-origin pinned
   to the corner it grows away from, drawn back to back starting at the
   top-left corner and running anti-clockwise: left edge down, bottom
   edge right, right edge up, top edge left. */
.olb{position:absolute;top:calc(var(--t)*1px);left:calc(var(--l)*1px);
     width:calc(var(--w)*1px);height:calc(var(--h)*1px);pointer-events:none}
.ol{position:absolute;background:#000}
.e1{left:0;top:0;width:1px;height:100%;transform:scaleY(0);transform-origin:top}
.e2{left:0;bottom:0;width:100%;height:1px;transform:scaleX(0);transform-origin:left}
.e3{right:0;top:0;width:1px;height:100%;transform:scaleY(0);transform-origin:bottom}
.e4{left:0;top:0;width:100%;height:1px;transform:scaleX(0);transform-origin:right}

/* ---- the search bar: clicking it swaps in a filled-in example query,
   then hands off to arte-search - GSAP drives the swap, see the JS below */
#searchbar{cursor:pointer;display:block}
#searchbar .active{position:absolute;top:0;left:0;width:978px;height:98px;opacity:0}

/* ---- the pinned header ------------------------------------------- */
/* 133px, always. The masthead strip and the icon pair on the right are
   identical in both states, so they are drawn once and never move. On the
   first scroll the header collapses the same way arte-document's does: the
   nav and the login pill fade out, the wordmark is wiped away by a mask
   closing leftwards onto the square's footprint, and a blue mark fades in
   slightly after to take its place. */
#hdr{position:absolute;top:0;left:0;width:1920px;height:133px;overflow:hidden;background:#fff}
#hdr i{position:absolute;top:0;left:0;width:1920px;height:5359px;
       background-image:url(arte-main/page.png);
       background-size:1920px auto;background-repeat:no-repeat}
#hdr .mast{position:absolute;top:0;left:0;width:1920px;height:32px;overflow:hidden}
#hdr .mast i{background-position:0 0}
#hdr .icons{position:absolute;top:32px;left:1680px;width:240px;height:101px;overflow:hidden}
#hdr .icons i{background-position:-1680px -32px}
/* nav labels are real text now (shared position/size/type across all four
   pages) instead of a per-page baked image, so the only thing that differs
   page to page is which item's color is .active - never its position */
#hdr .nav{position:absolute;top:60px;left:459px;width:917px;height:45px;
          transition:opacity .600s ease-in-out}
#hdr .nav .item{position:absolute;top:0;height:45px;line-height:45px;
  font:700 23px/45px Pretendard,sans-serif;color:#000;white-space:nowrap;
  transform:translateX(-50%);pointer-events:none}
#hdr .nav .item.active{color:#007ade}
#hdr .acct{position:absolute;top:62px;left:1475px;width:201px;height:41px;overflow:hidden;
           transition:opacity .600s ease-in-out}
#hdr .acct i{background-position:-1475px -62px}
/* the wordmark sits in a mask that closes leftwards onto the square's
   footprint as it fades, so the closing edge wipes it away */
#hdr .word{position:absolute;top:66px;left:160px;width:200px;height:32px;overflow:hidden;
  transition:left 1s cubic-bezier(.16,1,.3,1),width 1s cubic-bezier(.16,1,.3,1)}
#hdr .word i{background-position:-160px -66px;transition:opacity .467s ease-in-out}
#hdr .mark{position:absolute;top:56px;left:150px;width:51px;height:51px;overflow:hidden;
           opacity:0;transition:opacity .667s cubic-bezier(.5,1,.89,1) .200s}
#hdr .mark i{height:133px;background-image:url(arte-main/header-scrolled.png);
             background-position:-150px -56px}
#root.scrolled #hdr .word{left:150px;width:51px}
#root.scrolled #hdr .word i{opacity:0}
#root.scrolled #hdr .nav,#root.scrolled #hdr .acct{opacity:0}
#root.scrolled #hdr .mark{opacity:1}
#hdr .word,#hdr .mark{cursor:pointer}
#hdr .word:hover i,#hdr .mark:hover i{opacity:.72}

/* ---- header links -------------------------------------------------
   문서·도서 and 지역별 정보 in the nav link out to their own pages. Each hit
   area is that item's own flex box within the 40px-tall menu row (x459
   w170 for 문서·도서, x873 w190 for 지역별 정보 - the latter set inline since
   its left/width differ from the class default), with a hover rule
   spanning just the label - both go with the rest of the left content
   once the header collapses. */
#hdr .navlink{position:absolute;left:459px;top:62px;width:170px;height:40px;
  display:block;cursor:pointer;transition:opacity .600s ease-in-out}
#hdr .navlink b{position:absolute;left:40px;right:40px;bottom:1px;height:2px;
  background:#000;transform:scaleX(0);transform-origin:left center;
  transition:transform .28s cubic-bezier(.33,1,.68,1)}
#hdr .navlink:hover b{transform:scaleX(1)}
#root.scrolled #hdr .navlink{opacity:0;pointer-events:none}

/* ---- viewer chrome ------------------------------------------------ */
#ui{position:fixed;right:18px;bottom:18px;z-index:200}
#ui button{font:500 13px/1 inherit;color:#fff;background:rgba(17,17,17,.86);border:0;
  border-radius:999px;padding:11px 16px;cursor:pointer;backdrop-filter:blur(6px)}
#ui button:hover{background:#0078d7}
#hint{position:fixed;left:50%;bottom:22px;translate:-50% 0;z-index:200;
  font:500 13px/1 inherit;color:#fff;background:rgba(17,17,17,.8);
  border-radius:999px;padding:11px 18px;transition:opacity .4s ease-out}
#hint.gone{opacity:0;pointer-events:none}
</style>

<div id="hint">스크롤하면 콘텐츠가 등장합니다</div>
<div id="ui"><button id="replay">↻ 처음부터 다시 보기</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);

const root = document.getElementById('root');

/* The design is a fixed 1920px wide. Scale it down to fit narrower windows,
   but never up - the page render is 1x, so enlarging it only softens the
   type.

   This uses `zoom` rather than `transform: scale()` on purpose: zoom feeds
   into layout, so the document scroll height follows on its own and the
   sticky header still pins against the real viewport, and ScrollTrigger
   (which measures real layout boxes) sees the scaled positions correctly. */
function fit() {
  const s = Math.min(1, window.innerWidth / 1920);
  root.style.zoom = s;
  return s;
}
let scale = fit();
addEventListener('resize', () => { scale = fit(); ScrollTrigger.refresh(); });

/* read one of an element's own --custom-properties as a plain number */
const num = (el, name, fallback = 0) => {
  const v = getComputedStyle(el).getPropertyValue(name).trim();
  return v ? parseFloat(v) : fallback;
};

/* ---- the hero: composition frames 0-70, a GSAP timeline that plays on
   load and is independent of scroll - every element's own delay (--d,
   the frame it started on in the composition) becomes its position on
   this one timeline. ------------------------------------------------ */
const introTl = gsap.timeline({ paused: true });
document.querySelectorAll('#intro .rise').forEach((el) => {
  const i = el.querySelector('i');
  introTl.fromTo(i, { y: num(el, '--h'), opacity: 0 },
    { y: 0, opacity: 1, duration: .733, ease: 'expo.out' }, num(el, '--d'));
});
// hero headline: black wiped away by pink, left to right
document.querySelectorAll('#intro .wipe').forEach((el) => {
  introTl.fromTo(el, { clipPath: 'inset(0% 100% 0% 0%)' },
    { clipPath: 'inset(0% 0% 0% 0%)', duration: .8, ease: 'expo.out' }, num(el, '--d'));
});
function playIntro() { introTl.restart(); }
playIntro();
document.getElementById('replay').addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
  playIntro();
});

/* ---- the search bar: swap to a filled-in example query, then hand off
   to arte-search ------------------------------------------------------ */
const searchbar = document.getElementById('searchbar');
const searchActive = searchbar.querySelector('.active');
let searchClicked = false;
searchbar.addEventListener('click', (e) => {
  e.preventDefault();
  if (searchClicked) return;
  searchClicked = true;
  gsap.to(searchActive, { opacity: 1, duration: .2, ease: 'power1.out' });
  gsap.delayedCall(1, () => { window.location.href = searchbar.getAttribute('href'); });
});

/* ---- viewport-triggered reveals -------------------------------------
   One ScrollTrigger per element, each firing once - built after the hero
   intro finishes so a fast scroll right after load can't overtake it (its
   slowest element finishes at 2.333s). ScrollTrigger checks every trigger
   against the current scroll position the moment it's created, so
   anything already scrolled past at the 2.4s mark fires immediately here;
   there's no separate "sweep the bottom of the page" pass needed. ---- */
function buildScrollReveals() {
  const scope = document.querySelector('[data-scroll]');

  // all text, titles included: rises from the bottom of its own mask
  scope.querySelectorAll('.rise').forEach((el) => {
    const i = el.querySelector('i');
    const d = num(el, '--d');
    gsap.set(i, { y: num(el, '--h'), opacity: 0 });
    ScrollTrigger.create({
      trigger: el, start: 'top 88%', once: true,
      onEnter: () => gsap.to(i, { y: 0, opacity: 1, duration: .733, ease: 'expo.out', delay: d }),
    });
  });

  // decorative chrome (carousel dots/arrows): a plain fade, no motion
  scope.querySelectorAll('.fade').forEach((el) => {
    const i = el.querySelector('i');
    const d = num(el, '--d');
    const dur = num(el, '--dur', .6);
    gsap.set(i, { opacity: 0 });
    ScrollTrigger.create({
      trigger: el, start: 'top 88%', once: true,
      onEnter: () => gsap.to(i, { opacity: 1, duration: dur, ease: 'power2.out', delay: d }),
    });
  });

  // every image: settles from 130% down to 100% inside its fixed crop
  scope.querySelectorAll('.zoom').forEach((el) => {
    const i = el.querySelector('i');
    const d = num(el, '--d');
    gsap.set(i, { scale: 1.3, opacity: 0 });
    ScrollTrigger.create({
      trigger: el, start: 'top 88%', once: true,
      onEnter: () => gsap.to(i, { scale: 1, opacity: 1, duration: 1.333, ease: 'expo.out', delay: d }),
    });
  });

  // 문서 category chips: unfold left to right from the first ("전체") chip
  scope.querySelectorAll('.slide').forEach((el) => {
    const d = num(el, '--d');
    const dx = num(el, '--dx');
    gsap.set(el, { x: dx });
    ScrollTrigger.create({
      trigger: el, start: 'top 88%', once: true,
      onEnter: () => gsap.to(el, { x: 0, opacity: 1, duration: 1.067, ease: 'expo.out', delay: d }),
    });
  });

  // 공지·소식 rows: unfold top to bottom into their resting position
  scope.querySelectorAll('.cascade').forEach((el) => {
    const d = num(el, '--d');
    const dy = num(el, '--dy');
    gsap.set(el, { y: -dy });
    ScrollTrigger.create({
      trigger: el, start: 'top 88%', once: true,
      onEnter: () => gsap.to(el, { y: 0, opacity: 1, duration: .667, ease: 'expo.out', delay: d }),
    });
  });

  // title underlines: drawn left to right
  scope.querySelectorAll('.rule').forEach((el) => {
    const d = num(el, '--d');
    ScrollTrigger.create({
      trigger: el, start: 'top 88%', once: true,
      onEnter: () => gsap.to(el, { scaleX: 1, duration: .8, ease: 'expo.out', delay: d }),
    });
  });

  // 추천's book-curation backdrop: opens from its own centre outward
  scope.querySelectorAll('.expand').forEach((el) => {
    const d = num(el, '--d');
    const l = num(el, '--l'), w = num(el, '--w'), cx = num(el, '--cx');
    el.style.transformOrigin = `${((cx - l) / w) * 100}% 50%`;
    ScrollTrigger.create({
      trigger: el, start: 'top 88%', once: true,
      onEnter: () => gsap.to(el, { scaleX: 1, duration: .8, ease: 'power3.out', delay: d }),
    });
  });

  // boxes with a line: four segments drawn back to back from the top-left
  // corner, running anti-clockwise - down, right, up, left
  scope.querySelectorAll('.olb').forEach((el) => {
    const d = num(el, '--d');
    const seg = num(el, '--seg', .467);
    const [e1, e2, e3, e4] = ['.e1', '.e2', '.e3', '.e4'].map((s) => el.querySelector(s));
    ScrollTrigger.create({
      trigger: el, start: 'bottom 95%', once: true,
      onEnter: () => {
        gsap.timeline({ delay: d })
          .to(e1, { scaleY: 1, duration: seg, ease: 'none' })
          .to(e2, { scaleX: 1, duration: seg, ease: 'none' })
          .to(e3, { scaleY: 1, duration: seg, ease: 'none' })
          .to(e4, { scaleX: 1, duration: seg, ease: 'none' });
      },
    });
  });
}
setTimeout(buildScrollReveals, 2400);

/* ---- header collapse ----------------------------------------------- */
const hint = document.getElementById('hint');
function onScroll() {
  const y = window.scrollY / scale;              // back into page coordinates
  root.classList.toggle('scrolled', y > 80);
  if (y > 40) hint.classList.add('gone');
}
addEventListener('scroll', onScroll, { passive: true });
onScroll();
</script>
</body>
</html>
